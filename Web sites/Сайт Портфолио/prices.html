    <script src="script.js"></script>
    <script>
        // Language toggle functionality
        document.addEventListener('DOMContentLoaded', function() {
            const langRuBtn = document.getElementById('lang-ru');
            const langEnBtn = document.getElementById('lang-en');
            const htmlElement = document.documentElement;

            function updateLanguage(lang) {
                htmlElement.setAttribute('data-lang', lang);
                document.querySelectorAll('[data-ru], [data-en]').forEach(el => {
                    el.textContent = el.getAttribute(`data-${lang}`);
                });

                // Update active button state
                langRuBtn.classList.toggle('active', lang === 'ru');
                langEnBtn.classList.toggle('active', lang === 'en');
            }

            langRuBtn.addEventListener('click', () => {
                updateLanguage('ru');
                localStorage.setItem('preferredLang', 'ru');
            });

            langEnBtn.addEventListener('click', () => {
                updateLanguage('en');
                localStorage.setItem('preferredLang', 'en');
            });

            // Load saved language preference
            const savedLang = localStorage.getItem('preferredLang') || 'ru';
            updateLanguage(savedLang);
        });
    </script>
